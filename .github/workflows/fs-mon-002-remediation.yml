name: FS-MON-002 remediation candidate
on:
  pull_request:
  workflow_dispatch:
jobs:
  candidate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run original challenge and remediation candidate
        run: python -m pytest -q -rx tests/test_fs_mon_002_deployment_gap.py tests/test_fs_mon_002_guard_candidate.py
