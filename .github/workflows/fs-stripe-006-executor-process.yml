name: FS-STRIPE-006 Separate Executor Reference
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executor-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - run: cd harness && python -m pytest -q -rx tests/test_fs_stripe_006_executor_process.py tests/test_fs_stripe_005_protected_capture.py
