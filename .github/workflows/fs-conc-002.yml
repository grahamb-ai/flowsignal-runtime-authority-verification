name: FS-CONC-002 Hypothesis stateful challenge
on:
  push:
    branches: [challenge/fs-conc-002-hypothesis-stateful]
    paths:
      - .github/workflows/fs-conc-002.yml
      - harness/tests/test_fs_conc_002_hypothesis_stateful.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stateful:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install -r harness/requirements.txt
          python -m pip install 'hypothesis>=6,<7'
      - name: Run stateful authority exploration
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-conc-002.log
          python -m pytest -vv -s tests/test_fs_conc_002_hypothesis_stateful.py 2>&1 | tee -a ../fs-conc-002.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-conc-002.log
          exit "${status}"
      - name: Preserve evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-conc-002-hypothesis-${{ github.sha }}
          path: fs-conc-002.log
          retention-days: 90
