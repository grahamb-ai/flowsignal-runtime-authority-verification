name: Authority usage test-isolation qualification
on:
  push:
    branches: [fix/fs-auth-002-test-isolation]
    paths:
      - .github/workflows/authority-usage-isolation.yml
      - harness/tests/conftest.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  order:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, reverse]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run complete file-order regression
        shell: bash
        run: |
          set +e
          cd harness
          mapfile -t tests < <(find tests -maxdepth 1 -name 'test_*.py' | sort)
          if [ "${{ matrix.mode }}" = "reverse" ]; then
            mapfile -t tests < <(printf '%s\n' "${tests[@]}" | tac)
          fi
          git rev-parse HEAD | tee "../authority-usage-${{ matrix.mode }}.log"
          python -m pytest -vv "${tests[@]}" 2>&1 | tee -a "../authority-usage-${{ matrix.mode }}.log"
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a "../authority-usage-${{ matrix.mode }}.log"
          exit "${status}"
      - name: Preserve test-order evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-usage-isolation-${{ matrix.mode }}-${{ github.sha }}
          path: authority-usage-${{ matrix.mode }}.log
          retention-days: 90
