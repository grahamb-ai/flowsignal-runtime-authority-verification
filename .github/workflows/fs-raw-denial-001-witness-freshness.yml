name: FS-RAW-DENIAL-001 witness late-revocation candidate
on:
  pull_request:
  workflow_dispatch:
jobs:
  witness-freshness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -rx tests/test_fs_raw_denial_001_witness_current_authority.py tests/test_fs_raw_denial_001_witness_late_revocation.py
