name: FS-OUTBOX-001 revocation-before-dispatch challenge
on:
  push:
    branches: [challenge/fs-outbox-001-revocation-before-dispatch]
    paths:
      - .github/workflows/fs-outbox-001.yml
      - harness/tests/test_fs_outbox_001_revocation_before_dispatch.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run isolated outbox challenge
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-outbox-001.log
          python -m pytest -vv -s tests/test_fs_outbox_001_revocation_before_dispatch.py 2>&1 | tee -a ../fs-outbox-001.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-outbox-001.log
          exit "${status}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-outbox-001-first-run-${{ github.sha }}
          path: fs-outbox-001.log
          retention-days: 90
