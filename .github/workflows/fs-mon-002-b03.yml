name: FS-MON-002 B03 candidate
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify-b03:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_fs_mon_002_b03_revalidation.py
