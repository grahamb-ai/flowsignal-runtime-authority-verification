name: FS-AUTH-005 denial evidence qualification
on:
  push:
    branches: [challenge/fs-auth-005-denial-outcome-evidence]
    paths:
      - .github/workflows/fs-auth-005.yml
      - harness/tests/test_fs_auth_005_denial_outcome_evidence.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run isolated denial evidence test
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-auth-005.log
          python -m pytest -vv -s tests/test_fs_auth_005_denial_outcome_evidence.py 2>&1 | tee -a ../fs-auth-005.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-auth-005.log
          exit "${status}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-005-denial-evidence-${{ github.sha }}
          path: fs-auth-005.log
          retention-days: 90
