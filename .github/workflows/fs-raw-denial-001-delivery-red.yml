name: FS-RAW-DENIAL-001 missing delivery first RED
on:
  pull_request:
  workflow_dispatch:
jobs:
  delivery-first-red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -rx tests/test_fs_raw_denial_001_undelivered_revocation_red.py
