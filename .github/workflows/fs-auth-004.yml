name: FS-AUTH-004 dual-state hostile qualification
on:
  push:
    branches: [challenge/fs-auth-004-dual-state-commit]
    paths:
      - .github/workflows/fs-auth-004.yml
      - harness/tests/test_fs_auth_004_dual_state_commit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run isolated dual-state challenge
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-auth-004.log
          python -m pytest -vv -s tests/test_fs_auth_004_dual_state_commit.py 2>&1 | tee -a ../fs-auth-004.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-auth-004.log
          exit "${status}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-004-dual-state-${{ github.sha }}
          path: fs-auth-004.log
          retention-days: 90
