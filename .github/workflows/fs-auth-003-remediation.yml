name: FS-AUTH-003 remediation qualification
on:
  push:
    branches: [remediation/fs-auth-003-global-version-continuity]
    paths:
      - .github/workflows/fs-auth-003-remediation.yml
      - harness/app/engines/protected_consequence.py
      - harness/tests/test_fs_auth_003_global_version_commit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run preserved hostile test
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-auth-003-remediation.log
          python -m pytest -vv -s tests/test_fs_auth_003_global_version_commit.py 2>&1 | tee -a ../fs-auth-003-remediation.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-auth-003-remediation.log
          exit "${status}"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-003-remediation-${{ github.sha }}
          path: fs-auth-003-remediation.log
          retention-days: 90
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        order: [normal, reverse]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run all test files
        shell: bash
        run: |
          set +e
          cd harness
          mapfile -t tests < <(find tests -maxdepth 1 -name 'test_*.py' | sort)
          if [ "${{ matrix.order }}" = "reverse" ]; then
            mapfile -t tests < <(printf '%s\n' "${tests[@]}" | tac)
          fi
          python -m pytest -vv "${tests[@]}" 2>&1 | tee "../fs-auth-003-${{ matrix.order }}.log"
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a "../fs-auth-003-${{ matrix.order }}.log"
          exit "${status}"
      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-003-${{ matrix.order }}-${{ github.sha }}
          path: fs-auth-003-${{ matrix.order }}.log
          retention-days: 90
