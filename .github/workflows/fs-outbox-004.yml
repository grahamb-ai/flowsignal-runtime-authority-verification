name: FS-OUTBOX-004 actuator commitment qualification
on:
  push:
    branches: [challenge/fs-outbox-004-actuator-enforced-commit]
    paths:
      - .github/workflows/fs-outbox-004.yml
      - harness/app/engines/reference_authority_actuator.py
      - harness/tests/test_fs_outbox_004_actuator_commit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actuator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run bounded actuator schedules
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-outbox-004.log
          python -m pytest -vv -s tests/test_fs_outbox_004_actuator_commit.py 2>&1 | tee -a ../fs-outbox-004.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-outbox-004.log
          exit "${status}"
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-outbox-004-first-run-${{ github.sha }}
          path: fs-outbox-004.log
          retention-days: 90
