name: FS-OUTBOX-003 check-to-actuation race
on:
  push:
    branches: [challenge/fs-outbox-003-check-actuation-race]
    paths:
      - .github/workflows/fs-outbox-003.yml
      - harness/tests/test_fs_outbox_003_check_actuation_race.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run unremediated check-to-actuation challenge
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-outbox-003-first-red.log
          python -m pytest -vv -s tests/test_fs_outbox_003_check_actuation_race.py 2>&1 | tee -a ../fs-outbox-003-first-red.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-outbox-003-first-red.log
          exit "${status}"
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-outbox-003-first-run-${{ github.sha }}
          path: fs-outbox-003-first-red.log
          retention-days: 90
