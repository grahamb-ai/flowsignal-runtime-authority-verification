name: FS-MON-002 simulated consequence boundary
on:
  pull_request:
  workflow_dispatch:
jobs:
  simulated-consequence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Run challenge, guard, and simulated consequence tests
        run: python -m pytest -q -rx tests/test_fs_mon_002_deployment_gap.py tests/test_fs_mon_002_guard_candidate.py tests/test_fs_mon_002_simulated_consequence.py
