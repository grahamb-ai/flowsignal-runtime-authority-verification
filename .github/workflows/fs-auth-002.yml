name: FS-AUTH-002 first hostile run

on:
  push:
    branches:
      - challenge/fs-auth-002-post-bind-revocation
      - remediation/fs-auth-002-post-bind-continuity
    paths:
      - .github/workflows/fs-auth-002.yml
      - harness/tests/test_fs_auth_002_post_bind_revocation.py
      - harness/app/engines/institutional_authority.py
      - harness/app/engines/protected_consequence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen harness requirements
        run: python -m pip install -r harness/requirements.txt
      - name: Capture environment and candidate
        run: |
          python --version
          git rev-parse HEAD
          python -m pip freeze
      - name: Run isolated hostile test and preserve exit status
        shell: bash
        run: |
          set +e
          cd harness
          python -m pytest -vv -s tests/test_fs_auth_002_post_bind_revocation.py 2>&1 | tee ../fs-auth-002-first-run.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-auth-002-first-run.log
          exit "${status}"
      - name: Preserve first-run evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-002-first-run-${{ github.sha }}
          path: fs-auth-002-first-run.log
          if-no-files-found: warn
          retention-days: 90
