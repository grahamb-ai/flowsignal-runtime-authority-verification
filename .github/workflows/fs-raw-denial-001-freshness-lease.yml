name: FS-RAW-DENIAL-001 bounded authority freshness lease
on:
  pull_request:
  workflow_dispatch:
jobs:
  reference-lease:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Run reference lease tests, including documented residual window
        run: python -m pytest -q -rx tests/test_fs_raw_denial_001_authority_delivery_lease.py
