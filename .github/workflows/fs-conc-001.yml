name: FS-CONC-001 deterministic interleavings
on:
  push:
    branches: [challenge/fs-conc-001-interleaving-exploration]
    paths:
      - .github/workflows/fs-conc-001.yml
      - harness/tests/test_fs_conc_001_interleavings.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run deterministic schedules
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-conc-001.log
          python -m pytest -vv -s tests/test_fs_conc_001_interleavings.py 2>&1 | tee -a ../fs-conc-001.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-conc-001.log
          exit "${status}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-conc-001-${{ github.sha }}
          path: fs-conc-001.log
          retention-days: 90
