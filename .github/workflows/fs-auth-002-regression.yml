name: FS-AUTH-002 regression qualification

on:
  push:
    branches:
      - remediation/fs-auth-002-post-bind-continuity
    paths:
      - .github/workflows/fs-auth-002-regression.yml
      - harness/app/engines/**
      - harness/tests/test_fs_auth_002_post_bind_revocation.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, reverse]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Capture baseline
        run: |
          python --version
          git rev-parse HEAD
      - name: Execute selected order and retain output
        shell: bash
        run: |
          set +e
          cd harness
          python - <<'PY' > ../fs-auth-002-test-selection.txt
          from pathlib import Path
          paths = sorted(str(p) for p in Path('tests').glob('test_*.py'))
          print("\n".join(paths))
          PY
          if [ "${{ matrix.mode }}" = "reverse" ]; then
            mapfile -t tests < <(tac ../fs-auth-002-test-selection.txt)
          else
            mapfile -t tests < ../fs-auth-002-test-selection.txt
          fi
          python -m pytest -vv "${tests[@]}" 2>&1 | tee "../fs-auth-002-regression-${{ matrix.mode }}.log"
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a "../fs-auth-002-regression-${{ matrix.mode }}.log"
          exit "${status}"
      - name: Preserve regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-002-regression-${{ matrix.mode }}-${{ github.sha }}
          path: |
            fs-auth-002-regression-${{ matrix.mode }}.log
            fs-auth-002-test-selection.txt
          if-no-files-found: warn
          retention-days: 90
