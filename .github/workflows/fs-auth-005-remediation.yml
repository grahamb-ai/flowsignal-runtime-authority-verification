name: FS-AUTH-005 replay precedence qualification
on:
  push:
    branches: [remediation/fs-auth-005-replay-precedence]
    paths:
      - .github/workflows/fs-auth-005-remediation.yml
      - harness/app/engines/protected_consequence.py
      - harness/app/engines/permit_consumption_store.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        order: [normal, reverse, isolated]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run qualification
        shell: bash
        env:
          ORDER: ${{ matrix.order }}
        run: |
          set +e
          cd harness
          if [ "${ORDER}" = "isolated" ]; then
            tests=(tests/test_fs_auth_005_denial_outcome_evidence.py)
          else
            mapfile -t tests < <(find tests -maxdepth 1 -name 'test_*.py' | sort)
            if [ "${ORDER}" = "reverse" ]; then
              mapfile -t tests < <(printf '%s\n' "${tests[@]}" | tac)
            fi
          fi
          git rev-parse HEAD | tee "../fs-auth-005-${ORDER}.log"
          python -m pytest -vv -s "${tests[@]}" 2>&1 | tee -a "../fs-auth-005-${ORDER}.log"
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a "../fs-auth-005-${ORDER}.log"
          exit "${status}"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-005-${{ matrix.order }}-${{ github.sha }}
          path: fs-auth-005-${{ matrix.order }}.log
          retention-days: 90
