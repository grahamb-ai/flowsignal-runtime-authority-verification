name: FS-STRIPE-004 receipt contract preflight
on:
  push:
    branches: [challenge/fs-stripe-004-independent-authority-boundary]
    paths:
      - .github/workflows/fs-stripe-004-contract.yml
      - harness/app/engines/fs_stripe_004_contract_gate.py
      - harness/tests/test_fs_stripe_004_contract_gate.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run fail-closed receipt contract probes
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-stripe-004-contract.log
          python -m pytest -vv tests/test_fs_stripe_004_contract_gate.py 2>&1 | tee -a ../fs-stripe-004-contract.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-stripe-004-contract.log
          exit "$status"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-stripe-004-contract-${{ github.sha }}
          path: fs-stripe-004-contract.log
          retention-days: 90
