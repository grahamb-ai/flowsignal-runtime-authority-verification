name: FS-PI-001 mid-session substitution challenge
on:
  push:
    branches: [challenge/fs-pi-001-mid-session-action-substitution]
    paths:
      - .github/workflows/fs-pi-001.yml
      - harness/tests/test_fs_pi_001_mid_session_action_substitution.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run isolated prompt-injection consequence-substitution test
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-pi-001.log
          python -m pytest -vv -s tests/test_fs_pi_001_mid_session_action_substitution.py 2>&1 | tee -a ../fs-pi-001.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-pi-001.log
          exit "${status}"
      - name: Preserve first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-pi-001-first-run-${{ github.sha }}
          path: fs-pi-001.log
          retention-days: 90
