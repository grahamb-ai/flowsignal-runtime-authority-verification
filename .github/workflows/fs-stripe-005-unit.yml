name: FS-STRIPE-005 Protected Capture Tests
on: [pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - run: cd harness && python -m pytest -q -rx tests/test_fs_stripe_005_protected_dispatch.py
