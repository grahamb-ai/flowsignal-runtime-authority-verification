name: FS-AUTH-002 concurrent transition qualification
on:
  push:
    branches: [remediation/fs-auth-002-post-bind-continuity]
    paths:
      - .github/workflows/fs-auth-002-concurrency.yml
      - harness/tests/test_fs_auth_002_concurrent_transition.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Capture commit and environment
        run: |
          git rev-parse HEAD
          python --version
      - name: Run concurrency test in isolation
        shell: bash
        run: |
          set +e
          cd harness
          python -m pytest -vv -s tests/test_fs_auth_002_concurrent_transition.py 2>&1 | tee ../fs-auth-002-concurrency.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-auth-002-concurrency.log
          exit "${status}"
      - name: Preserve concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-auth-002-concurrency-${{ github.sha }}
          path: fs-auth-002-concurrency.log
          retention-days: 90
