name: FS-OUTBOX-002 dispatch-gate remediation
on:
  push:
    branches: [remediation/fs-outbox-002-dispatch-gate]
    paths:
      - .github/workflows/fs-outbox-002-remediation.yml
      - harness/tests/test_fs_outbox_002_post_commit_dispatch_race.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r harness/requirements.txt
      - name: Run dispatch-gate qualification
        shell: bash
        run: |
          set +e
          cd harness
          git rev-parse HEAD | tee ../fs-outbox-002-remediation.log
          python -m pytest -vv -s tests/test_fs_outbox_002_post_commit_dispatch_race.py 2>&1 | tee -a ../fs-outbox-002-remediation.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_status=${status}" | tee -a ../fs-outbox-002-remediation.log
          exit "${status}"
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-outbox-002-remediation-${{ github.sha }}
          path: fs-outbox-002-remediation.log
          retention-days: 90
