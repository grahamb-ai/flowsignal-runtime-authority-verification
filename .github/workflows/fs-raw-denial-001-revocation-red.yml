name: FS-RAW-DENIAL-001 cross-process revocation first RED
on:
  pull_request:
  workflow_dispatch:
jobs:
  revocation-first-red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -rx tests/test_fs_raw_denial_001_rai_external_actuator.py::test_first_red_revocation_after_export_must_prevent_external_commit
